spring.application.name=salao-api

# Nome do banco em memória
spring.datasource.url=jdbc:h2:mem:salao
spring.datasource.driver-class-name=org.h2.Driver

# JPA cria as tabelas automaticamente a partir das entidades
spring.jpa.hibernate.ddl-auto=create-drop

# Console visual do H2 (acesse em http://localhost:8080/h2-console)
spring.h2.console.enabled=true

# Ver o SQL gerado no terminal (ótimo para aprender)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
